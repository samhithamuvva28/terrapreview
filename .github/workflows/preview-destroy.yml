name: Preview Destroy

on:
  pull_request:
    types:
      - closed

concurrency:
  group: terrapreview-preview-pr-${{ github.event.pull_request.number }}-destroy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAPREVIEW_ENVIRONMENT: ${{ vars.TERRAPREVIEW_ENVIRONMENT }}
  TERRAPREVIEW_APP_NAME: ${{ vars.TERRAPREVIEW_APP_NAME }}
  TERRAPREVIEW_CONTROL_PLANE_URL: ${{ vars.TERRAPREVIEW_CONTROL_PLANE_URL }}
  TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL: ${{ vars.TERRAPREVIEW_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
  TERRAPREVIEW_ARTIFACT_BUCKET_NAME: ${{ vars.TERRAPREVIEW_ARTIFACT_BUCKET_NAME }}

jobs:
  destroy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write shared Terraform variables for automation
        run: |
          sanitize() {
            printf '%s' "$1" | tr -d '\r' | xargs
          }

          PROJECT_ID="$(sanitize "${PROJECT_ID}")"
          REGION="$(sanitize "${REGION}")"
          TERRAPREVIEW_ENVIRONMENT="$(sanitize "${TERRAPREVIEW_ENVIRONMENT}")"
          TERRAPREVIEW_APP_NAME="$(sanitize "${TERRAPREVIEW_APP_NAME}")"
          TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL="$(sanitize "${TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL}")"
          TERRAPREVIEW_ARTIFACT_BUCKET_NAME="$(sanitize "${TERRAPREVIEW_ARTIFACT_BUCKET_NAME}")"

          cat > infra/terraform/terraform.tfvars <<EOF
          project_id      = "${PROJECT_ID}"
          region          = "${REGION}"
          environment     = "${TERRAPREVIEW_ENVIRONMENT}"
          app_name        = "${TERRAPREVIEW_APP_NAME}"
          container_image = "us-docker.pkg.dev/cloudrun/container/hello"
          EOF

      - name: Destroy preview environment
        env:
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: ./scripts/preview-down.sh "${PREVIEW_ID}"

      - name: Report preview status to control plane
        if: env.TERRAPREVIEW_CONTROL_PLANE_URL != ''
        env:
          CLOSURE_REASON: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}
          EVENT_TYPE: ${{ github.event.pull_request.merged && 'pull_request.merged' || 'pull_request.closed' }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            "${TERRAPREVIEW_CONTROL_PLANE_URL}/previews/events" \
            -d "$(cat <<EOF
          {
            "preview_id": "${PREVIEW_ID}",
            "status": "destroyed",
            "pr_number": "${{ github.event.pull_request.number }}",
            "git_branch": "${{ github.head_ref }}",
            "git_sha": "${{ github.event.pull_request.head.sha }}",
            "environment": "${TERRAPREVIEW_ENVIRONMENT}",
            "app_name": "${TERRAPREVIEW_APP_NAME}",
            "event_type": "${EVENT_TYPE}",
            "closure_reason": "${CLOSURE_REASON}",
            "updated_at": "${{ github.event.pull_request.closed_at }}"
          }
          EOF
          )"

      - name: Comment preview teardown on pull request
        uses: actions/github-script@v7
        env:
          CLOSURE_REASON: ${{ github.event.pull_request.merged && 'Merged' || 'Closed Without Merge' }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        with:
          script: |
            const marker = '<!-- terrapreview-preview-comment -->';
            const body = `${marker}
            ## TerraPreview Preview

            Status: Destroyed
            Closure: ${process.env.CLOSURE_REASON}
            Preview ID: \`${process.env.PREVIEW_ID}\`
            Destroyed At: \`${process.env.CLOSED_AT}\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Write workflow summary
        env:
          CLOSURE_REASON: ${{ github.event.pull_request.merged && 'merged' || 'closed without merge' }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: |
          {
            echo "## TerraPreview Preview"
            echo
            echo "- Status: Destroyed"
            echo "- Closure Reason: ${CLOSURE_REASON}"
            echo "- Preview ID: ${PREVIEW_ID}"
            echo "- Trigger: pull_request.closed"
          } >> "${GITHUB_STEP_SUMMARY}"
