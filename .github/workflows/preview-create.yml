name: Preview Create Or Update

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: terrapreview-preview-pr-${{ github.event.pull_request.number }}-apply
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAPREVIEW_ENVIRONMENT: ${{ vars.TERRAPREVIEW_ENVIRONMENT }}
  TERRAPREVIEW_APP_NAME: ${{ vars.TERRAPREVIEW_APP_NAME }}
  TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL: ${{ vars.TERRAPREVIEW_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
  TERRAPREVIEW_ARTIFACT_BUCKET_NAME: ${{ vars.TERRAPREVIEW_ARTIFACT_BUCKET_NAME }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write shared Terraform variables for automation
        run: |
          sanitize() {
            printf '%s' "$1" | tr -d '\r' | xargs
          }

          PROJECT_ID="$(sanitize "${PROJECT_ID}")"
          REGION="$(sanitize "${REGION}")"
          TERRAPREVIEW_ENVIRONMENT="$(sanitize "${TERRAPREVIEW_ENVIRONMENT}")"
          TERRAPREVIEW_APP_NAME="$(sanitize "${TERRAPREVIEW_APP_NAME}")"
          TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL="$(sanitize "${TERRAPREVIEW_SERVICE_ACCOUNT_EMAIL}")"
          TERRAPREVIEW_ARTIFACT_BUCKET_NAME="$(sanitize "${TERRAPREVIEW_ARTIFACT_BUCKET_NAME}")"

          cat > infra/terraform/terraform.tfvars <<EOF
          project_id      = "${PROJECT_ID}"
          region          = "${REGION}"
          environment     = "${TERRAPREVIEW_ENVIRONMENT}"
          app_name        = "${TERRAPREVIEW_APP_NAME}"
          container_image = "us-docker.pkg.dev/cloudrun/container/hello"
          EOF

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push preview image
        id: image
        env:
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          IMAGE_TAG="${PREVIEW_ID}-${SHORT_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${TERRAPREVIEW_APP_NAME}-${TERRAPREVIEW_ENVIRONMENT}-repo/${TERRAPREVIEW_APP_NAME}-app:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}" \
            --push \
            app

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Create or update preview environment
        env:
          TERRAPREVIEW_GIT_BRANCH: ${{ github.head_ref }}
          TERRAPREVIEW_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          TERRAPREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: ./scripts/preview-up.sh "${PREVIEW_ID}" "${{ steps.image.outputs.image_uri }}"

      - name: Read preview URL
        id: preview
        env:
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: |
          sanitize() {
            printf '%s' "$1" | tr -d '\r' | xargs
          }

          PREVIEW_ID="$(sanitize "${PREVIEW_ID}")"
          TERRAPREVIEW_ARTIFACT_BUCKET_NAME="$(sanitize "${TERRAPREVIEW_ARTIFACT_BUCKET_NAME}")"

          terraform -chdir=infra/terraform/environments/preview init \
            -reconfigure \
            -backend-config="bucket=${TERRAPREVIEW_ARTIFACT_BUCKET_NAME}" \
            -backend-config="prefix=terraform/preview"
          terraform -chdir=infra/terraform/environments/preview workspace select "${PREVIEW_ID}"
          PREVIEW_URL="$(terraform -chdir=infra/terraform/environments/preview output -raw preview_service_url)"
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        with:
          script: |
            const marker = '<!-- terrapreview-preview-comment -->';
            const body = `${marker}
            ## TerraPreview Preview

            Status: Ready
            Preview ID: \`${process.env.PREVIEW_ID}\`
            Preview URL: ${process.env.PREVIEW_URL}
            Image: \`${process.env.IMAGE_URI}\`
            Updated: \`${process.env.UPDATED_AT}\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Write workflow summary
        env:
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          {
            echo "## TerraPreview Preview"
            echo
            echo "- Status: Ready"
            echo "- Preview ID: ${PREVIEW_ID}"
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Branch: ${GITHUB_HEAD_REF}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
